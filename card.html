<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визитка — ПАПИНА</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        .card {
            width: 90mm;
            height: 50mm;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            padding: 6mm;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4mm;
        }

        .card-left {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            flex: 1;
        }

        .logo {
            width: 140px;
            height: auto;
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-info a,
        .card-info span {
            font-size: 11px;
            color: #1a1a1a;
            text-decoration: none;
            display: block;
        }

        .card-info a:hover {
            color: #FF4D00;
        }

        .card-right {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr {
            width: 28mm;
            height: 28mm;
        }

        @media print {
            body {
                background: none;
            }
            .card {
                box-shadow: none;
                border: 1px solid #eee;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-left">
            <img src="papina-full-light.svg" alt="ПАПИНА" class="logo">
            <div class="card-info">
                <a href="tel:+79963033576">+7 996 303-35-76</a>
                <a href="https://papina.team" target="_blank">papina.team</a>
            </div>
        </div>
        <div class="card-right">
            <img src="qr-papina-team.svg" alt="QR papina.team" class="qr">
        </div>
    </div>
</body>
</html>
